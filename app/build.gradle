apply plugin: 'com.android.application'

android {
    namespace 'com.rajhans.bookingapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.rajhans.bookingapp"
        minSdkVersion 23
        targetSdkversion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
