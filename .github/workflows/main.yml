name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v2
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: curl -fSL "https://github.com/gradle/gradle/raw/refs/tags/v8.1.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v3
        with:
          name: Rajhans-Booking-APK
          path: app/build/outputs/apk/debug/app-debug.apk
